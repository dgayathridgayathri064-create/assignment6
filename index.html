
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Register Page -->
        <section id="registerPage" class="card">
            <h1>Register</h1>

            <form id="registerForm">
                <input type="text" id="regName"
                       placeholder="Enter Name" required>

                <input type="email" id="regEmail"
                       placeholder="Enter Email" required>

                <input type="password" id="regPassword"
                       placeholder="Enter Password (minimum 6 characters)"
                       minlength="6" required>

                <button type="submit">Create Account</button>
            </form>

            <p>Already registered?
                <a href="#" id="showLogin">Login</a>
            </p>

            <p id="registerMessage" class="message"></p>
        </section>

        <!-- Login Page -->
        <section id="loginPage" class="card hidden">
            <h1>Login</h1>

            <form id="loginForm">
                <input type="email" id="loginEmail"
                       placeholder="Enter Email" required>

                <input type="password" id="loginPassword"
                       placeholder="Enter Password" required>

                <button type="submit">Login</button>
            </form>

            <p>New user?
                <a href="#" id="showRegister">Register</a>
            </p>

            <p id="loginMessage" class="message"></p>
        </section>

        <!-- Dashboard Page -->
        <section id="dashboardPage" class="card hidden">
            <h1>Dashboard</h1>
            <h2 id="welcomeMessage">Welcome!</h2>
            <p>Login successful!</p>

            <button type="button" id="logoutButton">Logout</button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
